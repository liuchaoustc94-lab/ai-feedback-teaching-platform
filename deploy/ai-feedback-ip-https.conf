server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 111.231.120.59;

    ssl_certificate /etc/letsencrypt/live/111.231.120.59/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/111.231.120.59/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/ai-feedback-teaching-platform/current/dist;
    index index.html;

    location = /api {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
